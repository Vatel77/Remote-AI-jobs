name: Sync Remote Jobs

on:
  schedule:
    # Runs daily at 06:00 UTC. Vercel is Git-connected to this repo, so the
    # push at the end of this workflow triggers a fresh production deploy —
    # no separate deploy step needed.
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # needed to commit + push data/jobs.json

jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run job scraper (Remotive + Jobicy)
        run: node scripts/scraper.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify the site still builds with the new data
        run: npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name 'Jobs Sync Bot'
          git config --global user.email 'bot@remote-ai-jobs.com'
          git add data/jobs.json data/jobs-meta.json
          git commit -m "🔄 Sync remote AI jobs (Remotive + Jobicy)" || echo "No changes to commit"
          git push
