name: Sync Remote Jobs

on:
  schedule:
    # Runs daily at 06:00 UTC. Vercel is Git-connected to this repo, so the
    # push at the end of this workflow triggers a fresh production deploy —
    # no separate deploy step needed.
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # needed to commit + push data/jobs.json

jobs:
  sync-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run job scraper (Remotive + Jobicy)
        run: node scripts/scraper.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify the site still builds with the new data
        run: npm run build

      - name: Commit and push changes
        run: |
          git config --global user.name 'Jobs Sync Bot'
          git config --global user.email 'bot@remote-ai-jobs.com'
          git add data/jobs.json data/jobs-meta.json
          git commit -m "🔄 Sync remote AI jobs (Remotive + Jobicy)" || echo "No changes to commit"

          # main can move between checkout and push (a manual re-run, or the
          # other scheduled workflow, landing a commit in between) — rebase
          # onto the latest main and retry instead of failing outright.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $i/3) — rebasing onto latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Push still failing after retries."
          exit 1
