name: Auto-Blogger SEO

on:
  schedule:
    # Runs at 08:00 UTC every 2 days
    - cron: '0 8 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # needed to commit + push data/posts.json

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run Auto-Blogger Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/auto-blogger.mjs

      - name: Commit and Push changes
        run: |
          git config --global user.name 'AI Auto-Blogger'
          git config --global user.email 'bot@remote-ai-jobs.com'
          git add data/posts.json
          git commit -m "📝 SEO: Auto-published new blog post" || echo "No changes to commit"

          # main can move between checkout and push (a manual re-run, or the
          # other scheduled workflow, landing a commit in between) — rebase
          # onto the latest main and retry instead of failing outright.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $i/3) — rebasing onto latest main and retrying..."
            git pull --rebase origin main
          done
          echo "Push still failing after retries."
          exit 1
